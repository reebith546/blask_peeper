# Конфиг nginx для Black Pepper Flower Bar.
#
# Установка на сервере:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/blackpepper
#   sudo ln -s /etc/nginx/sites-available/blackpepper /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Перед этим замените:
#   - blackpepperflowerbar.kz и www.blackpepperflowerbar.kz — на реальные домены
#   - /srv/blackpepper — на реальный путь к проекту на сервере
#
# www склеен с основным доменом 301-редиректом (SEO: иначе поисковики видят
# два одинаковых сайта) — для него отдельный server-блок ниже.
#
# HTTPS сюда добавит сам certbot командой:
#   sudo certbot --nginx -d blackpepperflowerbar.kz -d www.blackpepperflowerbar.kz
# (он допишет server-блок на 443 порт и редирект с 80 на 443 автоматически —
# вручную ничего для HTTPS дописывать не нужно).

# gzip для текстовых ответов (HTML, CSS, JSON, SVG) — на 60–80% меньше трафика.
gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_vary on;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

# Зеркало www -> основной домен. Для HTTPS certbot продублирует этот блок на 443
# (с теми же сертификатами) вместе с return 301.
server {
    listen 80;
    server_name www.blackpepperflowerbar.kz;
    return 301 https://blackpepperflowerbar.kz$request_uri;
}

server {
    listen 80;
    server_name blackpepperflowerbar.kz;

    client_max_body_size 20M;

    # Статика и медиа не меняются между визитами — кэш в браузере на месяц.
    # CSS подписан версией (?v=…) в base.html, поэтому обновления подхватываются.
    location /static/ {
        alias /srv/blackpepper/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /srv/blackpepper/media/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/blackpepper/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
